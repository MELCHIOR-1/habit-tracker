name: Sync Habit Data

on:
  schedule:
    - cron: '0 22 * * *'   # UTC 22:00 = 北京时间 06:00
  workflow_dispatch:       # 允许在 Actions 页面手动触发
    inputs:
      backfill_months:
        description: '回填最近几个月（默认 12；历史缺失时可填 24 做更深度回溯）'
        required: false
        default: '12'

permissions:
  contents: write

concurrency:
  group: habit-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Sync & encrypt
        env:
          INTERVALS_KEY: ${{ secrets.INTERVALS_KEY }}
          DUOLINGO_USER: ${{ secrets.DUOLINGO_USER }}
          DUOLINGO_JWT: ${{ secrets.jwt_token }}
          WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
          DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
          BACKFILL_MONTHS: ${{ github.event.inputs.backfill_months || '12' }}
        run: node action-sync.mjs

      - name: Commit encrypted data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "sync: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # 手动触发或补跑时可能与上一次运行撞车导致 push 被拒，先变基再重试，避免本次同步成果丢失
            ok=0
            for i in 1 2 3; do
              if git pull --rebase --no-edit && git push; then ok=1; break; fi
              echo "第 $i 次推送失败，5 秒后重试..."
              sleep 5
            done
            if [ "$ok" != "1" ]; then
              echo "::error::同步结果推送失败，请检查仓库权限或稍后手动重跑"
              exit 1
            fi
          fi
