name: Sync Habit Data

on:
  schedule:
    - cron: '0 22 * * *'   # UTC 22:00 = 北京时间 06:00
  workflow_dispatch:       # 允许在 Actions 页面手动触发

permissions:
  contents: write

concurrency:
  group: habit-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Sync & encrypt
        env:
          INTERVALS_KEY: ${{ secrets.INTERVALS_KEY }}
          DUOLINGO_USER: ${{ secrets.DUOLINGO_USER }}
          WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
          DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
        run: node action-sync.mjs

      - name: Commit encrypted data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "sync: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
